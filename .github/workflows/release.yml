name: Release

# Tag vX.Y.Z on main: tests, multi-arch image to GHCR, npm tarball, GitHub release.
# Seeds are not built here; the previous release's seed assets are carried forward and
# scripts/publish-seed.sh replaces them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: npm tarball
        run: |
          npm run build
          mkdir -p dist-release
          npm pack --workspace packages/validator --pack-destination dist-release
          mv dist-release/*.tgz dist-release/spsdao-mini-validator.tgz
          cp install.sh spud dist-release/

      - name: Carry seeds forward from the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ]; then
            gh release download "$prev" --pattern 'seed-*' --dir dist-release || true
          fi
          cd dist-release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist-release/* --title "${{ github.ref_name }}" --generate-notes
